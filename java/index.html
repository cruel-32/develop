<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java · develop.cloudish.cloud</title>
    <!--
      CheerpJ(WASM JVM)는 Community License 조건상 자체 호스팅이 허용되지 않아,
      반드시 Leaning Technologies의 CDN에서 로더를 불러와야 한다. 이 프로젝트에서
      유일하게 외부 CDN에 의존하는 학습실이다.
    -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      CheerpJ는 System.out/System.err 출력을 id="console"인 엘리먼트에 직접 써준다
      (공식 문서화된 API가 아니라 CheerpJ 런타임의 관찰된 동작). SPA 라우터가 페이지를
      이동할 때마다 #app 내부를 통째로 새로 그리므로, 이 엘리먼트가 #app 안에 있으면
      다음 라우팅 때 사라졌다가 다시 생기면서 CheerpJ가 참조를 잃을 수 있다. 그래서
      #app 바깥, body 직속 자식으로 두어 페이지 이동과 무관하게 항상 같은 노드가
      유지되도록 한다 — javaClient.ts가 이 노드의 텍스트를 읽어 각 페이지의 실습창에
      복사해서 보여준다.
    -->
    <pre id="console" style="position: fixed; left: -9999px; top: -9999px"></pre>
    <div id="output" style="position: fixed; left: -9999px; top: -9999px"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
