services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-develop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-develop}
      POSTGRES_DB: ${POSTGRES_DB:-develop}
    ports:
      - "15432:5432"
    volumes:
      - db-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-develop} -d ${POSTGRES_DB:-develop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-develop}:${POSTGRES_PASSWORD:-develop}@db:5432/${POSTGRES_DB:-develop}
      # Windows Docker Desktop의 bind mount는 fs 이벤트를 못 넘길 때가 있어 폴링으로 대체한다.
      CHOKIDAR_USEPOLLING: "true"
      # 랜딩 페이지(/)와 /react 등 링크를 각 vite dev 서버의 호스트 포트로 보내기 위한 매핑.
      FRONTEND_DEV_PORTS: "react=5273,vue=5274,typescript=5275,ecma=5276,html-css=5277"
    ports:
      - "4100:4000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_WATCH_POLL: "true"
    ports:
      - "5273:5173"
    volumes:
      - ./frontend-react:/app
      - react-node-modules:/app/node_modules
    depends_on:
      - backend

  vue:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_WATCH_POLL: "true"
    ports:
      - "5274:5173"
    volumes:
      - ./frontend-vue:/app
      - vue-node-modules:/app/node_modules
    depends_on:
      - backend

  typescript:
    build:
      context: ./frontend-typescript
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_WATCH_POLL: "true"
    ports:
      - "5275:5173"
    volumes:
      - ./frontend-typescript:/app
      - typescript-node-modules:/app/node_modules
    depends_on:
      - backend

  ecma:
    build:
      context: ./frontend-ecma
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_WATCH_POLL: "true"
    ports:
      - "5276:5173"
    volumes:
      - ./frontend-ecma:/app
      - ecma-node-modules:/app/node_modules
    depends_on:
      - backend

  html-css:
    build:
      context: ./frontend-html-css
      dockerfile: Dockerfile.dev
    environment:
      VITE_WATCH_POLL: "true"
    ports:
      - "5277:5173"
    volumes:
      - ./frontend-html-css:/app
      - html-css-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db-local-data:
  backend-node-modules:
  react-node-modules:
  vue-node-modules:
  typescript-node-modules:
  ecma-node-modules:
  html-css-node-modules:
